# ── Gruvbox islands ── (matches sketchybar/colors.lua and kitty/gruvbox-dark.conf)
# bg #282828 · pill #3c3836 · fg #ebdbb2 · grey #928374
# yellow #fabd2f · orange #fe8019 · aqua #8ec07c

# True color, so the hex colors below are exact
set -as terminal-features ",xterm-256color:RGB"

# Transparent bar: every segment is its own rounded pill
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=default,fg=#ebdbb2"
set -g status-left-style "default"
set -g status-right-style "default"
set -g window-status-style "default"
set -g window-status-current-style "default"
set -g status-interval 30
set -g status-left-length 40
set -g status-right-length 60

# Session pill: orange, yellow while the prefix (C-t) is held
set -g status-left "#[fg=#{?client_prefix,#fabd2f,#fe8019},bg=default]#[fg=#282828,bg=#{?client_prefix,#fabd2f,#fe8019},bold]#S#[fg=#{?client_prefix,#fabd2f,#fe8019},bg=default,nobold]  "

# Windows: grey pills, the current one yellow like the active sketchybar space
set -g window-status-separator " "
set -g window-status-format "#[fg=#3c3836,bg=default]#[fg=#928374,bg=#3c3836]#I #W#{?window_zoomed_flag, 󰊓,}#[fg=#3c3836,bg=default]"
set -g window-status-current-format "#[fg=#fabd2f,bg=default]#[fg=#282828,bg=#fabd2f,bold]#I #W#{?window_zoomed_flag, 󰊓,}#[fg=#fabd2f,bg=default,nobold]"
set -g window-status-activity-style "fg=#fe8019"
set -g window-status-bell-style "fg=#fb4934"

# Right: current folder in aqua, then date grey / time yellow like the sketchybar clock
set -g status-right "#[fg=#3c3836,bg=default]#[fg=#8ec07c,bg=#3c3836]#{b:pane_current_path}#[fg=#3c3836,bg=default] #[fg=#3c3836,bg=default]#[fg=#928374,bg=#3c3836]#(LC_ALL=C date '+%%a %%d %%b') #[fg=#fabd2f,bg=#3c3836]%H:%M#[fg=#3c3836,bg=default]"

# Panes, messages, copy mode
set -g pane-border-style "fg=#3c3836"
set -g pane-active-border-style "fg=#fabd2f"
set -g display-panes-active-colour "#fabd2f"
set -g display-panes-colour "#928374"
set -g message-style "fg=#ebdbb2,bg=#3c3836"
set -g message-command-style "fg=#ebdbb2,bg=#3c3836"
set -g mode-style "fg=#282828,bg=#fabd2f"
set -g clock-mode-colour "#fabd2f"
